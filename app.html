<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollUp — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f8f9fa;
  --surface2: #f1f3f4;
  --surface3: #e8eaed;
  --border: #e8eaed;
  --border2: #dadce0;
  --accent: #1a73e8;
  --accent2: #1557b0;
  --accent-dim: rgba(26,115,232,0.08);
  --white: #ffffff;
  --text: #202124;
  --gray: #5f6368;
  --gray2: #9aa0a6;
  --red: #d93025;
  --red-dim: rgba(217,48,37,0.08);
  --green: #137333;
  --green-dim: rgba(19,115,51,0.08);
  --orange: #e37400;
  --orange-dim: rgba(227,116,0,0.08);
  --radius: 8px;
  --radius-lg: 12px;
  --transition: 0.15s cubic-bezier(0.4,0,0.2,1);
  --sidebar-w: 260px;
  --header-h: 64px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Roboto',-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  min-height:100vh;
  display:flex;
}
a{color:var(--accent);text-decoration:none}

/* Sidebar */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;
  width:var(--sidebar-w);
  background:var(--surface);
  border-right:1px solid var(--border);
  z-index:200;
  display:flex;flex-direction:column;
  transition:transform var(--transition);
  overflow-y:auto;
}
.sidebar-header{
  height:var(--header-h);
  display:flex;align-items:center;gap:10px;
  padding:0 20px;
  font-family:'Google Sans',sans-serif;
  font-weight:500;font-size:18px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.sidebar-header svg{width:28px;height:28px}
.sidebar-nav{flex:1;padding:12px}
.sidebar-nav button{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:10px 14px;border:none;
  border-radius:var(--radius);background:none;
  font-size:14px;color:var(--text);cursor:pointer;
  transition:background var(--transition);
  text-align:left;font-family:inherit;
}
.sidebar-nav button:hover{background:var(--surface2)}
.sidebar-nav button.active{background:var(--accent-dim);color:var(--accent);font-weight:500}
.sidebar-nav button svg{width:20px;height:20px;flex-shrink:0}
.sidebar-user{
  padding:16px 20px;border-top:1px solid var(--border);
  font-size:13px;
}
.sidebar-user .user-plan{
  display:inline-block;padding:2px 8px;border-radius:12px;
  font-size:11px;font-weight:500;margin-top:4px;
  background:var(--accent-dim);color:var(--accent);
}
.sidebar-user .user-plan.pro{background:var(--green-dim);color:var(--green)}
.sidebar-user .user-plan.max{background:var(--orange-dim);color:var(--orange)}

/* Main */
.main{
  margin-left:var(--sidebar-w);
  flex:1;min-width:0;
}
.topbar{
  position:sticky;top:0;z-index:100;
  height:var(--header-h);
  background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 24px;
}
.topbar-left{display:flex;align-items:center;gap:12px}
.hamburger{
  display:none;background:none;border:none;
  cursor:pointer;padding:4px;border-radius:var(--radius);
  color:var(--text);
}
.hamburger:hover{background:var(--surface2)}
.hamburger svg{width:24px;height:24px}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-right button{
  background:none;border:none;cursor:pointer;
  padding:6px;border-radius:50%;color:var(--gray);
  transition:background var(--transition);
  display:flex;
}
.topbar-right button:hover{background:var(--surface2)}

.page-content{padding:24px;max-width:1100px}

/* Views */
.view{display:none}
.view.active{display:block}

/* Cards */
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:24px;
  margin-bottom:16px;
}
.card h3{
  font-family:'Google Sans',sans-serif;
  font-size:18px;margin-bottom:16px;
}
.card h2{
  font-family:'Google Sans',sans-serif;
  font-size:24px;margin-bottom:8px;
}

/* Stats */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;margin-bottom:24px;
}
.stat-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
}
.stat-card .stat-value{
  font-family:'Google Sans',sans-serif;
  font-size:28px;font-weight:500;
}
.stat-card .stat-label{
  font-size:13px;color:var(--gray);margin-top:4px;
}

/* Tables */
table{width:100%;border-collapse:collapse}
th,td{
  text-align:left;padding:10px 14px;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
th{font-weight:500;color:var(--gray);font-size:12px;text-transform:uppercase;letter-spacing:0.3px}
tr:hover td{background:var(--surface)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:20px;
  font-size:13px;font-weight:500;cursor:pointer;
  border:none;transition:all var(--transition);
  background:var(--surface2);color:var(--text);
  text-decoration:none;font-family:inherit;
}
.btn:hover{background:var(--surface3)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--red-dim);color:var(--red)}
.btn-danger:hover{background:rgba(217,48,37,0.15)}
.btn-success{background:var(--green-dim);color:var(--green)}
.btn-sm{padding:4px 12px;font-size:12px;border-radius:14px}

/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--gray)}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 14px;
  border:1px solid var(--border2);
  border-radius:var(--radius);
  font-size:14px;font-family:inherit;
  transition:border var(--transition);
  background:var(--white);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-dim);
}
textarea{resize:vertical;min-height:60px}

/* Poll bars */
.poll-bar{
  height:8px;border-radius:4px;
  background:var(--surface3);
  overflow:hidden;margin-top:4px;
}
.poll-bar-fill{
  height:100%;border-radius:4px;
  transition:width 0.5s cubic-bezier(0.4,0,0.2,1);
  background:var(--accent);
}

/* Modal */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.4);z-index:300;
  align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--white);
  border-radius:var(--radius-lg);
  padding:32px;width:90%;max-width:520px;
  box-shadow:0 8px 32px rgba(0,0,0,0.12);
  max-height:90vh;overflow-y:auto;
}
.modal h3{font-family:'Google Sans',sans-serif;font-size:20px;margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;
  padding:12px 20px;border-radius:var(--radius-lg);
  font-size:13px;font-weight:500;z-index:400;
  opacity:0;transform:translateY(20px);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,0.12);
}
.toast.show{opacity:1;transform:translateY(0)}
.toast-success{background:var(--green);color:#fff}
.toast-error{background:var(--red);color:#fff}
.toast-info{background:var(--accent);color:#fff}

/* Alert */
.alert{
  padding:10px 14px;border-radius:var(--radius);
  font-size:13px;margin-bottom:14px;display:none;
}
.alert-error{background:var(--red-dim);color:var(--red);display:block}
.alert-success{background:var(--green-dim);color:var(--green);display:block}

/* Spinner */
.spinner{
  width:24px;height:24px;border:3px solid var(--surface3);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.6s linear infinite;
  margin:40px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty state */
.empty-state{
  text-align:center;padding:48px 20px;
}
.empty-state svg{width:64px;height:64px;color:var(--gray2);margin-bottom:16px}
.empty-state h4{font-family:'Google Sans',sans-serif;font-size:18px;margin-bottom:8px}
.empty-state p{color:var(--gray);font-size:14px;max-width:400px;margin:0 auto 20px}

/* Badge */
.badge{
  display:inline-block;padding:2px 8px;border-radius:10px;
  font-size:11px;font-weight:500;
}
.badge-active{background:var(--green-dim);color:var(--green)}
.badge-ended{background:var(--surface2);color:var(--gray)}
.badge-blocked{background:var(--red-dim);color:var(--red)}

/* Share section */
.share-box{
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px;margin-bottom:12px;
}
.share-box label{
  font-size:12px;font-weight:500;color:var(--gray);
  display:block;margin-bottom:8px;
}

/* Search */
.search-box{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border:1px solid var(--border2);
  border-radius:24px;background:var(--white);
  transition:border var(--transition);margin-bottom:16px;
  max-width:400px;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.search-box input{
  border:none;outline:none;flex:1;
  font-size:13px;background:none;color:var(--text);
}
.search-box svg{width:18px;height:18px;color:var(--gray);flex-shrink:0}

/* Responsive */
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
  .stat-grid{grid-template-columns:1fr}
  .page-content{padding:16px}
}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="7" fill="#1a73e8"/><path d="M7 12h5v9H7zM11 7h5v14h-5zM15 10h6v11h-6z" fill="#fff" opacity="0.9"/></svg>
    PollUp
  </div>
  <nav class="sidebar-nav" id="sidebar-nav">
    <button data-view="dashboard" class="active" onclick="showView('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </button>
    <button data-view="create" onclick="showView('create')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      New Poll
    </button>
    <button data-view="mypolls" onclick="showView('mypolls')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      My Polls
    </button>
    <button data-view="settings" onclick="showView('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </button>
  </nav>
  <div class="sidebar-user">
    <div id="sidebar-user-name" style="font-weight:500">User</div>
    <div id="sidebar-user-email" style="font-size:11px;color:var(--gray)">user@email.com</div>
    <span class="user-plan" id="sidebar-user-plan">Free</span>
    <button onclick="signOut()" style="display:block;margin-top:8px;background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;font-family:inherit">Sign out</button>
  </div>
</aside>

<!-- Main Content -->
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span id="view-title" style="font-family:'Google Sans',sans-serif;font-size:18px;font-weight:500">Dashboard</span>
    </div>
    <div class="topbar-right">
      <button id="btn-upgrade" onclick="showUpgradeModal()" style="font-size:12px;padding:6px 12px;background:var(--accent-dim);color:var(--accent);border-radius:16px;font-weight:500;border:none;cursor:pointer;font-family:inherit">Upgrade</button>
    </div>
  </header>

  <div class="page-content" id="page-content">

    <!-- VIEW: Dashboard -->
    <div class="view active" id="view-dashboard">
      <div class="stat-grid" id="dash-stats">
        <div class="stat-card"><div class="stat-value" id="stat-polls">—</div><div class="stat-label">Active polls</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-total-polls">—</div><div class="stat-label">Total polls</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-plan">Free</div><div class="stat-label">Current plan</div></div>
      </div>
      <div class="card">
        <h3>Quick actions</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="showView('create')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
            Create poll
          </button>
          <button class="btn" onclick="showView('mypolls')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
            My polls
          </button>
        </div>
      </div>
    </div>

    <!-- VIEW: Create Poll -->
    <div class="view" id="view-create">
      <div class="card" style="max-width:640px">
        <h3>Create a new poll</h3>
        <div id="create-alert" class="alert"></div>
        <form id="create-poll-form">
          <div class="form-group"><label>Question / Title</label><input type="text" id="poll-title" placeholder="What's your favorite...?" required></div>
          <div class="form-group">
            <label>Options</label>
            <div id="options-container">
              <div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" class="poll-option" placeholder="Option 1" required><button type="button" class="btn btn-sm btn-danger remove-option" style="display:none" onclick="removeOption(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
              <div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" class="poll-option" placeholder="Option 2" required><button type="button" class="btn btn-sm btn-danger remove-option" style="display:none" onclick="removeOption(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
            </div>
            <button type="button" class="btn btn-sm" onclick="addOption()" style="margin-top:6px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
              Add option
            </button>
          </div>
          <div class="form-group"><label><input type="checkbox" id="poll-multiple" style="width:auto;margin-right:6px"> Allow multiple choices</label></div>
          <div class="form-group"><label>Accent color</label><input type="color" id="poll-color" value="#1a73e8" style="width:60px;height:36px;padding:2px"></div>
          <div class="form-group"><label>End date (optional)</label><input type="datetime-local" id="poll-ends"></div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">Create poll</button>
        </form>
      </div>
    </div>

    <!-- VIEW: My Polls -->
    <div class="view" id="view-mypolls">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <h3 style="font-family:'Google Sans',sans-serif;font-size:20px">My Polls</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="mypolls-search" placeholder="Search polls..." oninput="filterMyPolls()">
          </div>
          <button class="btn btn-primary" onclick="showView('create')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
            New poll
          </button>
        </div>
      </div>
      <div id="mypolls-list"><div class="spinner"></div></div>
    </div>

    <!-- VIEW: Settings -->
    <div class="view" id="view-settings">
      <div class="card" style="max-width:500px">
        <h3>Account settings</h3>
        <div id="settings-alert" class="alert"></div>
        <div class="form-group"><label>Name</label><input type="text" id="settings-name"></div>
        <div class="form-group"><label>Email</label><input type="email" id="settings-email" disabled style="opacity:0.7"></div>
        <div class="form-group"><label>New password (leave blank to keep)</label><input type="password" id="settings-password" placeholder="Min 6 characters" minlength="6"></div>
        <button class="btn btn-primary" onclick="saveSettings()">Save changes</button>
      </div>
      <div class="card" style="max-width:500px">
        <h3>Your plan</h3>
        <p id="settings-plan-detail" style="color:var(--gray);font-size:14px"></p>
        <button class="btn btn-primary" onclick="showUpgradeModal()">Upgrade plan</button>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Generic Modal -->
<div class="modal-overlay" id="gModal">
  <div class="modal">
    <h3 id="gModal-title">Modal</h3>
    <div id="gModal-body"></div>
    <div id="gModal-footer" class="modal-actions"></div>
  </div>
</div>

<script>
// ============================================================
// AUTH CHECK
// ============================================================
var token = localStorage.getItem('pollup_token');
var user = JSON.parse(localStorage.getItem('pollup_user') || 'null');
if (!token || !user) { window.location.href = '/index.html'; }

var API = '/api';
var currentView = 'dashboard';
var allMyPolls = [];

// ============================================================
// HELPERS
// ============================================================
function esc(s) {
  var d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 3500);
}

async function api(method, path, body) {
  try {
    var opts = { method: method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }};
    if (body) opts.body = JSON.stringify(body);
    var res = await fetch(API + path, opts);
    var data = await res.json();
    return { ok: res.ok, data: data, status: res.status };
  } catch(e) {
    return { ok: false, data: { error: 'Network error. Please try again.' }, status: 0 };
  }
}

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('gModal-title').textContent = title;
  document.getElementById('gModal-body').innerHTML = bodyHtml;
  document.getElementById('gModal-footer').innerHTML = footerHtml;
  document.getElementById('gModal').classList.add('active');
}

function closeModal() {
  document.getElementById('gModal').classList.remove('active');
}

document.getElementById('gModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function signOut() {
  localStorage.removeItem('pollup_token');
  localStorage.removeItem('pollup_user');
  window.location.href = '/index.html';
}

function copyInput(elementId) {
  var el = document.getElementById(elementId);
  if (!el) return;
  el.select();
  el.setSelectionRange(0, 99999);
  try {
    navigator.clipboard.writeText(el.value).then(function() {
      showToast('Copied to clipboard', 'success');
    }).catch(function() {
      showToast('Copied to clipboard', 'success');
    });
  } catch(e) {
    showToast('Copied to clipboard', 'success');
  }
}

// ============================================================
// VIEW SWITCHING
// ============================================================
function showView(view) {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  var target = document.getElementById('view-' + view);
  if (target) target.classList.add('active');

  document.querySelectorAll('#sidebar-nav button').forEach(function(b) { b.classList.remove('active'); });
  var navBtn = document.querySelector('[data-view="' + view + '"]');
  if (navBtn) navBtn.classList.add('active');

  currentView = view;
  var titles = {
    dashboard: 'Dashboard', create: 'New Poll', mypolls: 'My Polls', settings: 'Settings'
  };
  document.getElementById('view-title').textContent = titles[view] || view;
  document.getElementById('sidebar').classList.remove('open');

  if (view === 'dashboard') loadDashboard();
  if (view === 'mypolls') loadMyPolls();
  if (view === 'settings') loadSettings();
}

// ============================================================
// INIT
// ============================================================
function init() {
  document.getElementById('sidebar-user-name').textContent = user.name;
  document.getElementById('sidebar-user-email').textContent = user.email;
  var planEl = document.getElementById('sidebar-user-plan');
  var planName = (user.plan || 'free').charAt(0).toUpperCase() + (user.plan || 'free').slice(1);
  planEl.textContent = planName;
  planEl.className = 'user-plan ' + (user.plan || 'free');

  var upgradeBtn = document.getElementById('btn-upgrade');
  if (user.plan === 'free') upgradeBtn.textContent = 'Upgrade to Pro';
  else if (user.plan === 'pro') upgradeBtn.textContent = 'Upgrade to Max';
  else { upgradeBtn.textContent = 'You are on Max'; upgradeBtn.style.opacity = '0.6'; }

  loadDashboard();
}

// ============================================================
// DASHBOARD
// ============================================================
async function loadDashboard() {
  var result = await api('GET', '/polls');
  if (result.ok) {
    var polls = result.data.polls || [];
    allMyPolls = polls;
    var activePolls = polls.filter(function(p) { return p.sts === 1; });
    document.getElementById('stat-polls').textContent = activePolls.length;
    document.getElementById('stat-total-polls').textContent = polls.length;
    document.getElementById('stat-plan').textContent = (user.plan || 'free').charAt(0).toUpperCase() + (user.plan || 'free').slice(1);
  }
}

// ============================================================
// CREATE POLL
// ============================================================
var optionCount = 2;

function addOption() {
  optionCount++;
  var container = document.getElementById('options-container');
  var div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:8px;margin-bottom:6px';
  div.innerHTML = '<input type="text" class="poll-option" placeholder="Option ' + optionCount + '" required><button type="button" class="btn btn-sm btn-danger remove-option" onclick="removeOption(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
  container.appendChild(div);
  updateRemoveButtons();
}

function removeOption(btn) {
  var container = document.getElementById('options-container');
  if (container.children.length <= 2) return;
  btn.parentElement.remove();
  updateRemoveButtons();
}

function updateRemoveButtons() {
  var container = document.getElementById('options-container');
  var buttons = container.querySelectorAll('.remove-option');
  buttons.forEach(function(b) {
    b.style.display = container.children.length <= 2 ? 'none' : 'inline-flex';
  });
}

document.getElementById('create-poll-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var alertEl = document.getElementById('create-alert');
  alertEl.className = 'alert';
  var btn = this.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Creating...';

  var optionInputs = document.querySelectorAll('.poll-option');
  var options = [];
  optionInputs.forEach(function(i) {
    var v = i.value.trim();
    if (v) options.push(v);
  });

  if (options.length < 2) {
    alertEl.className = 'alert alert-error';
    alertEl.textContent = 'At least 2 options required';
    btn.disabled = false;
    btn.textContent = 'Create poll';
    return;
  }

  var body = {
    title: document.getElementById('poll-title').value.trim(),
    options: options,
    multiple: document.getElementById('poll-multiple').checked,
    color: document.getElementById('poll-color').value,
    endsAt: document.getElementById('poll-ends').value ? new Date(document.getElementById('poll-ends').value).getTime() : null
  };

  var result = await api('POST', '/polls', body);
  if (result.ok) {
    showToast('Poll created successfully', 'success');
    this.reset();
    optionCount = 2;
    document.getElementById('options-container').innerHTML = 
      '<div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" class="poll-option" placeholder="Option 1" required><button type="button" class="btn btn-sm btn-danger remove-option" style="display:none" onclick="removeOption(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>' +
      '<div style="display:flex;gap:8px;margin-bottom:6px"><input type="text" class="poll-option" placeholder="Option 2" required><button type="button" class="btn btn-sm btn-danger remove-option" style="display:none" onclick="removeOption(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
    showShareModal(result.data.poll);
  } else {
    alertEl.className = 'alert alert-error';
    alertEl.textContent = result.data.error || 'Failed to create poll';
  }
  btn.disabled = false;
  btn.textContent = 'Create poll';
});

// ============================================================
// SHARE MODAL
// ============================================================
function showShareModal(poll) {
  var pollUrl = window.location.origin + '/poll.html?p=' + poll.slg;
  var embedCode = '<script src="' + window.location.origin + '/embed.js" data-poll="' + poll.slg + '"><\/script>';
  
  var bodyHtml = 
    '<div class="share-box">' +
      '<label>Share link</label>' +
      '<div style="display:flex;gap:8px">' +
        '<input type="text" id="share-link-input" value="' + esc(pollUrl) + '" readonly ' +
          'style="flex:1;padding:10px 14px;border:1px solid #dadce0;border-radius:8px;font-size:13px;font-family:monospace;background:#f8f9fa;color:#202124" ' +
          'onclick="this.select()">' +
        '<button class="btn btn-primary btn-sm" onclick="copyInput(\'share-link-input\')" style="white-space:nowrap">Copy link</button>' +
      '</div>' +
    '</div>' +
    '<div class="share-box">' +
      '<label>Embed code</label>' +
      '<textarea id="embed-code-input" readonly rows="2" ' +
        'style="width:100%;padding:10px 14px;border:1px solid #dadce0;border-radius:8px;font-size:12px;font-family:monospace;background:#f8f9fa;color:#202124;resize:none" ' +
        'onclick="this.select()">' + esc(embedCode) + '</textarea>' +
      '<button class="btn btn-primary btn-sm" onclick="copyInput(\'embed-code-input\')" style="margin-top:8px">Copy code</button>' +
    '</div>' +
    '<p style="font-size:12px;color:#5f6368;margin-top:8px">Anyone with the link can vote. No login required.</p>';
  
  var footerHtml = 
    '<button class="btn" onclick="closeModal()">Close</button>' +
    '<button class="btn btn-primary" onclick="closeModal();showView(\'mypolls\')">View all polls</button>';
  
  openModal('Poll created', bodyHtml, footerHtml);
}

function showEmbedModal(slug) {
  var embedCode = '<script src="' + window.location.origin + '/embed.js" data-poll="' + slug + '"><\/script>';
  var bodyHtml = 
    '<p style="color:#5f6368;font-size:13px;margin-bottom:12px">Copy and paste this code into your website:</p>' +
    '<textarea id="embed-modal-input" readonly rows="2" ' +
      'style="width:100%;padding:12px;border:1px solid #dadce0;border-radius:8px;font-size:12px;font-family:monospace;background:#f8f9fa;color:#202124;resize:none;margin-bottom:12px" ' +
      'onclick="this.select()">' + esc(embedCode) + '</textarea>' +
    '<button class="btn btn-primary" onclick="copyInput(\'embed-modal-input\');closeModal()" style="width:100%;justify-content:center">Copy code</button>';
  var footerHtml = '<button class="btn" onclick="closeModal()">Close</button>';
  openModal('Embed code', bodyHtml, footerHtml);
}

// ============================================================
// MY POLLS
// ============================================================
async function loadMyPolls() {
  var container = document.getElementById('mypolls-list');
  container.innerHTML = '<div class="spinner"></div>';

  var result = await api('GET', '/polls');
  if (!result.ok) {
    container.innerHTML = '<div class="empty-state"><p style="color:var(--red)">Failed to load polls</p></div>';
    return;
  }

  allMyPolls = result.data.polls || [];
  renderMyPolls(allMyPolls);
}

function renderMyPolls(polls) {
  var container = document.getElementById('mypolls-list');
  
  if (polls.length === 0) {
    container.innerHTML = 
      '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>' +
        '<h4>No polls yet</h4>' +
        '<p>Create your first poll and share it with the world.</p>' +
        '<button class="btn btn-primary" onclick="showView(\'create\')">Create poll</button>' +
      '</div>';
    return;
  }

  container.innerHTML = polls.map(function(p) {
    var opts = p.opt || [];
    var statusBadge = p.sts === 1 ? '<span class="badge badge-active">Active</span>' :
                      p.sts === 2 ? '<span class="badge badge-ended">Ended</span>' :
                      '<span class="badge badge-blocked">Blocked</span>';
    var pollUrl = window.location.origin + '/poll.html?p=' + p.slg;
    var embedCode = '<script src="' + window.location.origin + '/embed.js" data-poll="' + p.slg + '"><\/script>';
    
    var resultsHtml = '';
    if (p.sts === 2 && p.snap) {
      var results = p.snap;
      if (typeof p.snap === 'string') results = JSON.parse(p.snap);
      var total = results.reduce(function(s, r) { return s + (r.count || 0); }, 0);
      resultsHtml = 
        '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' +
          '<p style="font-size:11px;color:#5f6368;margin-bottom:8px">Final results — ' + total + ' vote' + (total !== 1 ? 's' : '') + '</p>' +
          results.map(function(r) {
            return '<div style="margin-bottom:6px">' +
              '<div style="display:flex;justify-content:space-between;font-size:12px">' +
                '<span>' + esc(r.text) + '</span><span style="color:#5f6368">' + (r.count || 0) + '</span>' +
              '</div>' +
              '<div class="poll-bar"><div class="poll-bar-fill" style="width:' + (total > 0 ? Math.round((r.count/total)*100) : 0) + '%"></div></div>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    return '<div class="card" style="margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">' +
        '<div style="flex:1;min-width:200px">' +
          '<h4 style="font-family:\'Google Sans\',sans-serif;font-size:16px;margin-bottom:4px">' + esc(p.tit) + '</h4>' +
          '<p style="font-size:12px;color:#5f6368;margin-bottom:4px">' + opts.length + ' options ' + statusBadge + ' Created ' + new Date(p.cat).toLocaleDateString() + '</p>' +
          '<p style="font-size:11px;color:var(--gray2);word-break:break-all">' + esc(pollUrl) + '</p>' +
        '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
          '<button class="btn btn-sm" onclick="window.open(\'/poll.html?p=' + p.slg + '\',\'_blank\')">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> View' +
          '</button>' +
          '<button class="btn btn-sm" onclick="copyToClipboard2(\'' + esc(pollUrl) + '\')">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Link' +
          '</button>' +
          '<button class="btn btn-sm" onclick="showEmbedModal(\'' + p.slg + '\')">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Embed' +
          '</button>' +
          (p.sts === 1 ? '<button class="btn btn-sm btn-danger" onclick="closePoll(\'' + p.id + '\')">Close</button>' : '') +
          '<button class="btn btn-sm btn-danger" onclick="deletePoll(\'' + p.id + '\')">Delete</button>' +
        '</div>' +
      '</div>' +
      resultsHtml +
    '</div>';
  }).join('');
}

function copyToClipboard2(text) {
  navigator.clipboard.writeText(text).then(function() {
    showToast('Link copied', 'success');
  }).catch(function() {
    showToast('Failed to copy', 'error');
  });
}

function filterMyPolls() {
  var q = (document.getElementById('mypolls-search')?.value || '').toLowerCase();
  if (!q) { renderMyPolls(allMyPolls); return; }
  var filtered = allMyPolls.filter(function(p) { return p.tit.toLowerCase().indexOf(q) > -1; });
  renderMyPolls(filtered);
}

async function closePoll(id) {
  if (!confirm('Close this poll? Votes will be tallied and final results saved.')) return;
  var result = await api('POST', '/polls/' + id + '/close');
  if (result.ok) { showToast('Poll closed', 'success'); loadMyPolls(); }
  else showToast('Failed to close poll', 'error');
}

async function deletePoll(id) {
  if (!confirm('Delete this poll permanently? This cannot be undone.')) return;
  var result = await api('DELETE', '/polls/' + id);
  if (result.ok) { showToast('Poll deleted', 'success'); loadMyPolls(); }
  else showToast('Failed to delete poll', 'error');
}

// ============================================================
// SETTINGS
// ============================================================
function loadSettings() {
  document.getElementById('settings-name').value = user.name || '';
  document.getElementById('settings-email').value = user.email || '';
  var plan = (user.plan || 'free');
  var planName = plan.charAt(0).toUpperCase() + plan.slice(1);
  document.getElementById('settings-plan-detail').textContent = 'You are on the ' + planName + ' plan.';
}

async function saveSettings() {
  var alertEl = document.getElementById('settings-alert');
  alertEl.className = 'alert';
  var name = document.getElementById('settings-name').value.trim();
  if (!name) { alertEl.className = 'alert alert-error'; alertEl.textContent = 'Name is required'; return; }

  user.name = name;
  localStorage.setItem('pollup_user', JSON.stringify(user));
  document.getElementById('sidebar-user-name').textContent = name;
  showToast('Settings saved', 'success');
}

// ============================================================
// UPGRADE MODAL
// ============================================================
function showUpgradeModal() {
  var plans = {
    free: { next: 'pro', price: '$5/month', features: '50 active polls, 5K votes/poll, custom colors, remove branding' },
    pro: { next: 'max', price: '$12/month', features: 'Unlimited polls, unlimited votes, CSV export, API access, priority support' },
    max: { next: null, price: null, features: 'You have everything!' }
  };
  var current = user.plan || 'free';
  var plan = plans[current];

  if (!plan.next) {
    showToast('You are already on the Max plan', 'info');
    return;
  }

  var bodyHtml = 
    '<p style="color:#5f6368;margin-bottom:16px">Upgrade from <strong>' + current.charAt(0).toUpperCase() + current.slice(1) + '</strong> to <strong>' + plan.next.charAt(0).toUpperCase() + plan.next.slice(1) + '</strong></p>' +
    '<p style="font-size:24px;font-weight:500;font-family:\'Google Sans\',sans-serif;margin-bottom:8px">' + plan.price + '</p>' +
    '<p style="color:#5f6368;font-size:14px;margin-bottom:16px">' + plan.features + '</p>' +
    '<p style="font-size:12px;color:#9aa0a6">This is a demo. In production, real payment will be processed.</p>';
  
  var footerHtml = 
    '<button class="btn" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="activateUpgrade(\'' + plan.next + '\')">Upgrade now</button>';
  
  openModal('Upgrade Plan', bodyHtml, footerHtml);
}

async function activateUpgrade(plan) {
  user.plan = plan;
  localStorage.setItem('pollup_user', JSON.stringify(user));
  closeModal();
  showToast('Upgraded to ' + plan.charAt(0).toUpperCase() + plan.slice(1), 'success');
  setTimeout(function() { location.reload(); }, 1000);
}

// ============================================================
// STARTUP
// ============================================================
init();
</script>
</body>
</html>
